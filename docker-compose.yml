services:
  # === Triple Stores ===

  # QLever - High-performance SPARQL engine (handles Wikidata-scale datasets)
  # SPARQL endpoint: http://qlever:7001 (POST queries directly)
  # Built-in UI at http://localhost:7001
  # Requires indexing before first use - see README for setup instructions
  qlever:
    image: adfreiburg/qlever:latest
    container_name: qlever
    ports:
      - "7001:7001"
    volumes:
      - qlever_data:/data
    environment:
      - INDEX_PREFIX=index
    restart: unless-stopped
    networks:
      - rdf-network

  # Apache Jena Fuseki - Mature SPARQL 1.1 server with TDB2 storage and reasoning
  # SPARQL endpoint: http://fuseki:3030/ds/sparql
  # Admin UI at http://localhost:3030 (admin/admin)
  fuseki:
    image: secoresearch/fuseki:5.5.0
    container_name: fuseki
    ports:
      - "3030:3030"
    volumes:
      - fuseki_data:/fuseki
    environment:
      - ADMIN_PASSWORD=admin
    restart: unless-stopped
    networks:
      - rdf-network

  # === Repository Management ===

  rdf4j:
    image: eclipse/rdf4j-workbench:5.2.2
    container_name: rdf4j
    ports:
      - "8082:8080"
    networks:
      - rdf-network

  # === Data Transformation ===

  ontorefine:
    image: ontotext/refine
    container_name: ontorefine
    restart: unless-stopped
    ports:
      - "7333:7333"
    volumes:
      - refine_data:/opt/ontorefine/data
    networks:
      - rdf-network

  openrefine:
    image: felixlohmeier/openrefine:3.5.0
    container_name: openrefine
    ports:
      - "3333:3333"
    volumes:
      - openrefine_data:/data
    command: -i 0.0.0.0 -d /data -m 1024M
    restart: unless-stopped
    networks:
      - rdf-network

  # RML Mapper - Convert structured data (CSV, JSON, XML) to RDF using RML mappings
  # Usage: docker compose run --rm rmlmapper -m /data/mapping.ttl
  rmlmapper:
    image: rmlio/rmlmapper-java:v7.3.3
    container_name: rmlmapper
    volumes:
      - ./data:/data
    profiles:
      - tools
    networks:
      - rdf-network

  # === Visualization & Browsing ===

  webvowl:
    image: metacodingio/webvowl:v1
    container_name: webvowl
    ports:
      - "8083:8080"
    networks:
      - rdf-network

  # Trifid - Linked Data proxy with built-in Graph Explorer (Zazuko)
  trifid:
    image: ghcr.io/zazuko/trifid:latest
    container_name: trifid
    ports:
      - "8084:8080"
    environment:
      - SPARQL_ENDPOINT_URL=http://qlever:7001
    networks:
      - rdf-network

  # Blueprint - Knowledge graph browser (Zazuko)
  blueprint:
    image: ghcr.io/zazuko/blueprint:latest
    container_name: blueprint
    ports:
      - "8085:80"
    environment:
      - ENDPOINT_URL=http://qlever:7001
      - SPARQL_CONSOLE_URL=http://trifid:8080/sparql
      - GRAPH_EXPLORER_URL=http://trifid:8080/graph-explorer
    networks:
      - rdf-network

  # === Query Tools ===

  # YASGUI - Standalone SPARQL query editor with autocomplete and visualization
  yasgui:
    image: redpencil/yasgui:latest
    container_name: yasgui
    ports:
      - "8086:80"
    environment:
      - DEFAULT_SPARQL_ENDPOINT=http://localhost:7001
    networks:
      - rdf-network

  # Comunica - Federated SPARQL query engine for querying across multiple endpoints
  comunica:
    image: comunica/query-sparql:latest
    container_name: comunica
    ports:
      - "8087:8080"
    command: http --port 8080 http://qlever:7001 http://fuseki:3030/ds/sparql
    restart: unless-stopped
    networks:
      - rdf-network

  # Zazuko SHACL Playground - Client-side SHACL shape validation tool
  # Build from source: git clone https://github.com/zazuko/shacl-playground && cd shacl-playground && docker build -t shacl-playground .
  # shacl-playground:
  #   build: ./shacl-playground
  #   container_name: shacl-playground
  #   ports:
  #     - "8088:80"
  #   networks:
  #     - rdf-network

networks:
  rdf-network:

volumes:
  qlever_data:
  fuseki_data:
  refine_data:
  openrefine_data:
