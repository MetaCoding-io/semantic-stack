services:
  blazegraph:
    image: lyrasis/blazegraph:2.1.5
    container_name: blazegraph
    ports:
      - "9999:8080"
    networks:
      - rdf-network
    volumes:
      - blazegraph_data:/var/lib/blazegraph

  rdf4j:
    image: eclipse/rdf4j-workbench:5.2.2
    container_name: rdf4j
    ports:
      - "8082:8080"
    depends_on:
      - blazegraph
    networks:
      - rdf-network

  ontorefine:
    image: ontotext/refine
    container_name: ontorefine
    restart: unless-stopped
    ports:
      - "7333:7333"
    volumes:
      - refine_data:/opt/ontorefine/data
    networks:
      - rdf-network

  openrefine:
    image: easypi/openrefine
    ports:
      - "3333:3333"
    volumes:
      - openrefine_data:/data
    environment:
      - REFINE_INTERFACE=0.0.0.0
      - REFINE_PORT=3333
      - REFINE_MIN_MEMORY=1024M
      - REFINE_MEMORY=1024M
      - REFINE_DATA_DIR=/data
      - REFINE_EXTRA_OPTS=refine.headless=true
    restart: unless-stopped
    networks:
      - rdf-network

  webvowl:
    image: metacodingio/webvowl:v1
    container_name: webvowl
    ports:
      - "8083:8080"
    networks:
      - rdf-network

  # docker run --rm -it -p 8080:8080 ghcr.io/zazuko/trifid:latest
  # Write docker-compose service entry to replicate the above docker command
  trifid:
    image: ghcr.io/zazuko/trifid:latest
    container_name: trifid
    ports:
      - "8084:8080"
    environment:
      - SPARQL_ENDPOINT_URL=http://blazegraph:8080/bigdata/namespace/kb/sparql
      # - DATASET_BASE_URL: the base URL to use to enable rewriting
      # - SPARQL_USER: the user to use to authenticate against the SPARQL endpoint
      # - SPARQL_PASSWORD: the password to use to authenticate against the SPARQL endpoint
    networks:
      - rdf-network

  # docker pull ghcr.io/zazuko/blueprint:latest
  blueprint:
    image: ghcr.io/zazuko/blueprint:latest
    container_name: blueprint
    ports:
      - "8085:80"
    environment:
      - ENDPOINT_URL=http://blazegraph:8080/bigdata/namespace/kb/sparql
      - SPARQL_CONSOLE_URL=http://trifid:8080/sparql
      - GRAPH_EXPLORER_URL=http://trifid:8080/graph-explorer
    networks:
      - rdf-network

  # Oxigraph - Modern Rust-based RDF triplestore with built-in YASGUI UI
  oxigraph:
    image: oxigraph/oxigraph:latest
    container_name: oxigraph
    ports:
      - "7878:7878"
    volumes:
      - oxigraph_data:/data
    command: serve --location /data --bind 0.0.0.0:7878
    restart: unless-stopped
    networks:
      - rdf-network

  # Apache Jena Fuseki - Mature SPARQL 1.1 server with TDB2 storage
  fuseki:
    image: secoresearch/fuseki:5.5.0
    container_name: fuseki
    ports:
      - "3030:3030"
    volumes:
      - fuseki_data:/fuseki
    environment:
      - ADMIN_PASSWORD=admin
    restart: unless-stopped
    networks:
      - rdf-network

  # YASGUI - Standalone SPARQL query editor with autocomplete and visualization
  yasgui:
    image: redpencil/yasgui:latest
    container_name: yasgui
    ports:
      - "8086:80"
    environment:
      - DEFAULT_SPARQL_ENDPOINT=http://localhost:9999/bigdata/namespace/kb/sparql
    networks:
      - rdf-network

  # Zazuko SHACL Playground - Client-side SHACL shape validation tool
  # Build from source: git clone https://github.com/zazuko/shacl-playground && cd shacl-playground && docker build -t shacl-playground .
  # shacl-playground:
  #   build: ./shacl-playground
  #   container_name: shacl-playground
  #   ports:
  #     - "8087:80"
  #   networks:
  #     - rdf-network

networks:
  rdf-network:

volumes:
  blazegraph_data:
  refine_data:
  openrefine_data:
  oxigraph_data:
  fuseki_data:

