# Brings the stack up for real and checks that every service answers.
# Jobs run in parallel; each one pulls the prebuilt images from GHCR and only rebuilds an image
# whose Dockerfile directory changed in this push/PR, so a typical run finishes in about two minutes.
name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches upstream drift in the few images that have no version tags

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read   # pull the images publish-images.yml pushed to GHCR

jobs:
  config:
    name: compose config + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose with every profile
        run: |
          docker compose config -q
          docker compose --profile '*' config -q
          docker compose --profile '*' -f compose.yml -f examples/compose.external-network.yml config -q
      - name: shellcheck
        run: shellcheck scripts/*.sh qlever-ui/*.sh

  default-stack:
    name: default stack (Fuseki primary)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            webvowl: ['webvowl/**']
            openrefine: ['openrefine/**']
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt images (build the ones whose Dockerfile changed)
        run: |
          set -x
          if [ "${{ steps.changed.outputs.webvowl }}" = "true" ];    then docker compose build webvowl;    else docker compose pull webvowl    || docker compose build webvowl;    fi
          if [ "${{ steps.changed.outputs.openrefine }}" = "true" ]; then docker compose build openrefine; else docker compose pull openrefine || docker compose build openrefine; fi
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300
      - name: Load sample data
        run: ./scripts/load.sh
      - name: Smoke test
        run: ./scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 150

  qlever-profile:
    name: qlever profile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run QLever as the runner's user so it can write ./qlever
        run: |
          echo "QLEVER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "QLEVER_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build the QLever index (Olympics demo data)
        run: docker compose --profile qlever-index run --rm qlever-index
      - name: Start QLever and its UI
        run: docker compose --profile qlever up -d --wait --wait-timeout 180 qlever qlever-ui
      - name: Smoke test
        run: ./scripts/smoke.sh qlever qlever-ui
      - name: Logs on failure
        if: failure()
        run: docker compose --profile qlever logs --tail 150

  oxigraph-profile:
    name: oxigraph profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Start Oxigraph
        run: docker compose --profile oxigraph up -d --wait --wait-timeout 120 oxigraph
      - name: Load sample data into Oxigraph
        run: ./scripts/load.sh
      - name: Smoke test
        run: ./scripts/smoke.sh oxigraph oxigraph-data
      - name: Logs on failure
        if: failure()
        run: docker compose --profile oxigraph logs --tail 150

  ontop-profile:
    name: ontop profile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start Postgres + Ontop
        run: docker compose --profile ontop up -d --build --wait --wait-timeout 300 postgres ontop
      - name: Smoke test
        run: ./scripts/smoke.sh ontop ontop-data
      - name: Logs on failure
        if: failure()
        run: docker compose --profile ontop logs --tail 150

  tools-image:
    name: tools image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            tools: ['tools/**']
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the prebuilt toolbox (build it when tools/ changed)
        run: |
          if [ "${{ steps.changed.outputs.tools }}" = "true" ]; then docker compose --profile tools build tools; else docker compose --profile tools pull tools || docker compose --profile tools build tools; fi
      - name: pySHACL validates the sample data
        run: docker compose --profile tools run --rm tools pyshacl -s sample/shapes.ttl sample/semantic-stack.ttl
      - name: LinkML generators run
        run: |
          docker compose --profile tools run --rm tools gen-owl linkml/semantic-stack.yaml > /dev/null
          docker compose --profile tools run --rm tools gen-shacl linkml/semantic-stack.yaml > /dev/null
          docker compose --profile tools run --rm tools gen-json-schema linkml/semantic-stack.yaml > /dev/null
      - name: pyLODE documents the vocabulary
        run: docker compose --profile tools run --rm tools pylode sample/semantic-stack-vocab.ttl -o out/vocab.html
      - name: RML pipeline
        run: |
          docker compose --profile tools run --rm yarrrml -i /data/rml/mapping.yarrrml.yml -o /data/rml/mapping.rml.ttl
          docker compose --profile tools run --rm rmlmapper -m /data/rml/mapping.rml.ttl -o /data/rml/output.ttl -s turtle
          docker compose --profile tools run --rm tools python -c "from rdflib import Graph; g=Graph().parse('rml/output.ttl'); assert len(g) > 10, len(g); print(len(g), 'triples')"
