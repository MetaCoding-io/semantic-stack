# Brings the stack up for real and checks that every service answers.
# Jobs run in parallel; each one pulls the prebuilt images from GHCR and only rebuilds an image
# whose Dockerfile directory changed in this push/PR, so a typical run finishes in about two minutes.
name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches upstream drift in the few images that have no version tags

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read   # pull the images publish-images.yml pushed to GHCR

jobs:
  config:
    name: compose config + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose with every profile
        run: |
          docker compose config -q
          docker compose --profile '*' config -q
          docker compose --profile '*' -f compose.yml -f examples/compose.external-network.yml config -q
      - name: shellcheck
        run: shellcheck scripts/*.sh qlever-ui/*.sh

  default-stack:
    name: default stack (Fuseki primary)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changed
        with:
          filters: |
            webvowl: ['webvowl/**']
            openrefine: ['openrefine/**']
            pyshacl: ['pyshacl/**']
            shacl-play: ['shacl-play/**']
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt images (build the ones whose Dockerfile changed)
        run: |
          set -x
          if [ "${{ steps.changed.outputs.webvowl }}" = "true" ];    then docker compose build webvowl;    else docker compose pull webvowl    || docker compose build webvowl;    fi
          if [ "${{ steps.changed.outputs.openrefine }}" = "true" ]; then docker compose build openrefine; else docker compose pull openrefine || docker compose build openrefine; fi
          if [ "${{ steps.changed.outputs.pyshacl }}" = "true" ];    then docker compose build pyshacl;    else docker compose pull pyshacl    || docker compose build pyshacl;    fi
          if [ "${{ steps.changed.outputs.shacl-play }}" = "true" ]; then docker compose build shacl-play; else docker compose pull shacl-play || docker compose build shacl-play; fi
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300
      - name: Load sample data
        run: ./scripts/load.sh
      - name: Smoke test
        run: |
          ./scripts/smoke.sh
          ./scripts/smoke.sh skosmos-data pyshacl-validate
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 150

  qlever-profile:
    name: qlever profile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run QLever as the runner's user so it can write ./qlever
        run: |
          echo "QLEVER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "QLEVER_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build the QLever index (Olympics demo data)
        run: docker compose --profile qlever-index run --rm qlever-index
      - name: Start QLever and its UI
        run: docker compose --profile qlever up -d --wait --wait-timeout 180 qlever qlever-ui
      - name: Smoke test
        run: ./scripts/smoke.sh qlever qlever-ui
      - name: Logs on failure
        if: failure()
        run: docker compose --profile qlever logs --tail 150

  oxigraph-profile:
    name: oxigraph profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Start Oxigraph
        run: docker compose --profile oxigraph up -d --wait --wait-timeout 120 oxigraph
      - name: Wait for Oxigraph to answer
        # The image is distroless, so it has no healthcheck and `up --wait` returns before it listens.
        run: ./scripts/smoke.sh oxigraph
      - name: Load sample data into Oxigraph
        run: ./scripts/load.sh
      - name: Smoke test
        run: ./scripts/smoke.sh oxigraph oxigraph-data
      - name: Logs on failure
        if: failure()
        run: docker compose --profile oxigraph logs --tail 150

  ontop-profile:
    name: ontop profile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start Postgres + Ontop
        run: docker compose --profile ontop up -d --build --wait --wait-timeout 300 postgres ontop
      - name: Smoke test
        run: ./scripts/smoke.sh ontop ontop-data
      - name: Logs on failure
        if: failure()
        run: docker compose --profile ontop logs --tail 150

  tools-image:
    name: tools image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changed
        with:
          filters: |
            tools: ['tools/**']
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the prebuilt toolbox (build it when tools/ changed)
        run: |
          if [ "${{ steps.changed.outputs.tools }}" = "true" ]; then docker compose --profile tools build tools; else docker compose --profile tools pull tools || docker compose --profile tools build tools; fi
      - name: pySHACL validates the sample data
        run: docker compose --profile tools run --rm tools pyshacl -s sample/shapes.ttl sample/semantic-stack.ttl
      - name: LinkML generators run
        run: |
          docker compose --profile tools run --rm tools gen-owl linkml/semantic-stack.yaml > /dev/null
          docker compose --profile tools run --rm tools gen-shacl linkml/semantic-stack.yaml > /dev/null
          docker compose --profile tools run --rm tools gen-json-schema linkml/semantic-stack.yaml > /dev/null
      - name: pyLODE documents the vocabulary
        run: docker compose --profile tools run --rm tools pylode sample/semantic-stack-vocab.ttl -o out/vocab.html
      - name: RML pipeline
        run: |
          docker compose --profile tools run --rm yarrrml -i /data/rml/mapping.yarrrml.yml -o /data/rml/mapping.rml.ttl
          docker compose --profile tools run --rm rmlmapper -m /data/rml/mapping.rml.ttl -o /data/rml/output.ttl -s turtle
          docker compose --profile tools run --rm tools python -c "from rdflib import Graph; g=Graph().parse('rml/output.ttl'); assert len(g) > 10, len(g); print(len(g), 'triples')"
      - name: SDM-RDFizer executes the same RML
        run: |
          docker compose --profile tools run --rm sdm-rdfizer
          ls -l data/rml/sdm-output/
          docker compose --profile tools run --rm tools python -c "import glob; from rdflib import Graph; f=glob.glob('rml/sdm-output/*.ttl')+glob.glob('rml/sdm-output/*.nt'); assert f, 'no output'; g=Graph().parse(f[0]); assert len(g) > 10, len(g); print(f[0], len(g), 'triples')"
      - name: rudof validates the sample data (SHACL)
        run: docker compose --profile tools run --rm rudof shacl-validate --shapes sample/shapes.ttl sample/semantic-stack.ttl
      - name: EYE reasons over Notation3
        run: docker compose --profile tools run --rm eye --quiet --nope n3/socrates.n3 --pass | tee /dev/stderr | grep -q Mortal
      - name: jelly-cli round-trips the sample data
        run: |
          docker compose --profile tools run --rm tools sh -c 'jelly-cli rdf to-jelly sample/semantic-stack.ttl > out/semantic-stack.jelly && jelly-cli rdf inspect out/semantic-stack.jelly'
      - name: ROBOT reasons over the vocabulary
        run: |
          docker compose --profile tools run --rm robot reason --reasoner ELK --input sample/semantic-stack-vocab.ttl --output out/vocab-reasoned.ttl
          grep -q 'owl:Class' data/out/vocab-reasoned.ttl
      - name: Nemo derives the transitive dependency closure
        run: |
          docker compose --profile tools run --rm nemo -D out -o nemo/dependencies.rls
          grep -q transitivelyDependsOn data/out/nemo-derived.ttl
      - name: WIDOCO documents the vocabulary
        run: |
          docker compose --profile tools run --rm widoco -ontFile data/sample/semantic-stack-vocab.ttl -outFolder data/out/widoco -rewriteAll -webVowl -uniteSections -lang en
          # a slash ontology IRI (http://localhost:8084/vocab/) makes WIDOCO write into a doc/ subfolder
          ls data/out/widoco/doc/ && test -s "$(ls data/out/widoco/doc/index*.html | head -1)"
      - name: RPT runs a SPARQL file over the sample data
        run: docker compose --profile tools run --rm rpt-cli integrate sample/semantic-stack.ttl queries/01-services-by-category.rq | tee /dev/stderr | grep -q Fuseki

  # One job per optional profile. `services` is what to start (default: every service in the profile),
  # `load` posts data/sample into the stores first, `checks` are scripts/smoke.sh check names.
  profiles:
    name: ${{ matrix.profile }} profile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: virtuoso,       services: "virtuoso",                      build: "",           load: true,  checks: "virtuoso virtuoso-data" }
          - { profile: geosparql,      services: "fuseki-geosparql",              build: "",           load: true,  checks: "geosparql geosparql-data geosparql-query" }
          - { profile: prez,           services: "fuseki prez prez-ui",           build: "",           load: true,  checks: "prez prez-ui" }
          - { profile: grlc,           services: "fuseki grlc",                   build: "",           load: true,  checks: "grlc grlc-query" }
          - { profile: graph-explorer, services: "fuseki graph-explorer",         build: "",           load: true,  checks: "graph-explorer" }
          - { profile: docs,           services: "landing pylode",                build: "pylode",     load: false, checks: "pylode pylode-render" }
          - { profile: rpt,            services: "fuseki rpt",                    build: "",           load: true,  checks: "rpt rpt-query" }
          - { profile: lp-etl,         services: "",                              build: "",           load: true,  checks: "lp-etl lp-etl-pipeline lp-etl-data" }
          - { profile: validation,     services: "itb-shacl",                     build: "",           load: false, checks: "itb-shacl itb-validate" }
          - { profile: observability,  services: "fuseki prometheus sparql-exporter grafana", build: "", load: true, checks: "prometheus sparql-exporter grafana" }
          - { profile: mcp,            services: "fuseki sparql-mcp rudof-mcp open-ontologies", build: "sparql-mcp", load: true, checks: "sparql-mcp rudof-mcp open-ontologies" }
          - { profile: solid,          services: "solid",                         build: "",           load: false, checks: "solid" }
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the profile's images
        run: docker compose --profile ${{ matrix.profile }} pull --ignore-buildable ${{ matrix.services }} || true
      - name: Build the profile's local images (prebuilt ones are pulled from GHCR when they exist)
        if: matrix.build != ''
        run: docker compose --profile ${{ matrix.profile }} pull ${{ matrix.build }} || docker compose --profile ${{ matrix.profile }} build ${{ matrix.build }}
      - name: Start
        run: docker compose --profile ${{ matrix.profile }} up -d --wait --wait-timeout 300 ${{ matrix.services }} || docker compose --profile ${{ matrix.profile }} ps -a
      - name: Load sample data
        if: matrix.load
        run: |
          ./scripts/smoke.sh fuseki >/dev/null 2>&1 || true
          ./scripts/load.sh
      - name: Smoke test
        run: ./scripts/smoke.sh ${{ matrix.checks }}
      - name: Logs on failure
        if: failure()
        run: |
          docker compose --profile ${{ matrix.profile }} ps -a
          docker compose --profile ${{ matrix.profile }} logs --tail 100
