# Publishes the images this repo builds itself, so `docker compose pull` works without a local build.
# Packages: ghcr.io/metacoding-io/semantic-stack-{webvowl,openrefine,tools,ontop}
name: publish-images

on:
  push:
    branches: [main]
    paths:
      - webvowl/**
      - openrefine/**
      - tools/**
      - ontop/**
      - .github/workflows/publish-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: webvowl
            tags: ghcr.io/metacoding-io/semantic-stack-webvowl:1.1.7,ghcr.io/metacoding-io/semantic-stack-webvowl:latest
          - name: openrefine
            tags: ghcr.io/metacoding-io/semantic-stack-openrefine:3.10.0,ghcr.io/metacoding-io/semantic-stack-openrefine:latest
          - name: tools
            tags: ghcr.io/metacoding-io/semantic-stack-tools:latest
          - name: ontop
            tags: ghcr.io/metacoding-io/semantic-stack-ontop:5.5.0,ghcr.io/metacoding-io/semantic-stack-ontop:latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.name }}
          push: true
          tags: ${{ matrix.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
