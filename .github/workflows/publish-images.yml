# Publishes the images this repo builds itself, so `docker compose pull` works without a local build.
# Packages: ghcr.io/metacoding-io/semantic-stack-{webvowl,openrefine,tools,ontop,pyshacl,shacl-play,pylode,sparql-mcp,flexible-graphrag-mcp}
name: publish-images

on:
  push:
    branches: [main]
    paths:
      - webvowl/**
      - openrefine/**
      - tools/**
      - ontop/**
      - pyshacl/**
      - shacl-play/**
      - pylode/**
      - sparql-mcp/**
      - flexible-graphrag-mcp/**
      - .github/workflows/publish-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: webvowl
            tags: ghcr.io/metacoding-io/semantic-stack-webvowl:1.1.7,ghcr.io/metacoding-io/semantic-stack-webvowl:latest
          - name: openrefine
            tags: ghcr.io/metacoding-io/semantic-stack-openrefine:3.10.0,ghcr.io/metacoding-io/semantic-stack-openrefine:latest
          - name: tools
            tags: ghcr.io/metacoding-io/semantic-stack-tools:latest
          - name: ontop
            tags: ghcr.io/metacoding-io/semantic-stack-ontop:5.5.0,ghcr.io/metacoding-io/semantic-stack-ontop:latest
          - name: pyshacl
            tags: ghcr.io/metacoding-io/semantic-stack-pyshacl:0.40.1,ghcr.io/metacoding-io/semantic-stack-pyshacl:latest
          - name: shacl-play
            tags: ghcr.io/metacoding-io/semantic-stack-shacl-play:0.12.5,ghcr.io/metacoding-io/semantic-stack-shacl-play:latest
          - name: pylode
            tags: ghcr.io/metacoding-io/semantic-stack-pylode:3.6.0,ghcr.io/metacoding-io/semantic-stack-pylode:latest
          - name: sparql-mcp
            tags: ghcr.io/metacoding-io/semantic-stack-sparql-mcp:d9c0d57,ghcr.io/metacoding-io/semantic-stack-sparql-mcp:latest
          - name: flexible-graphrag-mcp
            tags: ghcr.io/metacoding-io/semantic-stack-flexible-graphrag-mcp:0.8.4,ghcr.io/metacoding-io/semantic-stack-flexible-graphrag-mcp:latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.name }}
          push: true
          tags: ${{ matrix.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
