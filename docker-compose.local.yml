services:
  # === Triple Stores ===

  # Oxigraph - Modern Rust-based RDF triplestore with built-in YASGUI UI
  # SPARQL endpoint: http://oxigraph:7878/query (query) / http://oxigraph:7878/update (update)
  oxigraph:
    image: oxigraph/oxigraph:latest
    container_name: oxigraph
    ports:
      - "7878:7878"
    volumes:
      - oxigraph_data:/data
      - ./data:/import
    command: serve --location /data --bind 0.0.0.0:7878
    restart: unless-stopped
    networks:
      - monorepo_default

  # Apache Jena Fuseki - Mature SPARQL 1.1 server with TDB2 storage and reasoning
  # SPARQL endpoint: http://fuseki:3030/ds/sparql
  # Admin UI at http://localhost:3030 (admin/admin)
  fuseki:
    image: secoresearch/fuseki:5.5.0
    container_name: fuseki
    ports:
      - "3030:3030"
    volumes:
      - fuseki_data:/fuseki
    environment:
      - ADMIN_PASSWORD=admin
    restart: unless-stopped
    networks:
      - monorepo_default

  # QLever - High-performance SPARQL engine (Wikidata-scale)
  # Requires data indexing before use. See README for setup instructions.
  # qlever:
  #   image: adfreiburg/qlever:latest
  #   container_name: qlever
  #   ports:
  #     - "7001:7001"
  #   volumes:
  #     - qlever_data:/data
  #   networks:
  #     - monorepo_default

  # === Repository Management ===

  rdf4j:
    image: eclipse/rdf4j-workbench:5.2.2
    container_name: rdf4j
    ports:
      - "8082:8080"
    networks:
      - monorepo_default

  # === Data Transformation ===

  ontorefine:
    image: ontotext/refine
    container_name: ontorefine
    restart: unless-stopped
    ports:
      - "7333:7333"
    volumes:
      - refine_data:/opt/ontorefine/data
    networks:
      - monorepo_default

  openrefine:
    image: felixlohmeier/openrefine:3.5.0
    container_name: openrefine
    ports:
      - "3333:3333"
    volumes:
      - openrefine_data:/data
    command: -i 0.0.0.0 -d /data -m 1024M
    restart: unless-stopped
    networks:
      - monorepo_default

  # RML Mapper - Convert structured data (CSV, JSON, XML) to RDF using RML mappings
  # Usage: docker compose -f docker-compose.local.yml run --rm rmlmapper -m /data/mapping.ttl
  rmlmapper:
    image: rmlio/rmlmapper-java:v7.3.3
    container_name: rmlmapper
    volumes:
      - ./data:/data
    profiles:
      - tools
    networks:
      - monorepo_default

  # === Visualization & Browsing ===

  webvowl:
    image: metacodingio/webvowl:v1
    container_name: webvowl
    ports:
      - "8083:8080"
    networks:
      - monorepo_default

  # Trifid - Linked Data proxy with built-in Graph Explorer (Zazuko)
  trifid:
    image: ghcr.io/zazuko/trifid:latest
    container_name: trifid
    ports:
      - "8084:8080"
    environment:
      - SPARQL_ENDPOINT_URL=http://oxigraph:7878/query
      - SPARQL_USERNAME=admin
      - SPARQL_PASSWORD=admin
    networks:
      - monorepo_default

  # Blueprint - Knowledge graph browser (Zazuko)
  blueprint:
    image: ghcr.io/zazuko/blueprint:latest
    container_name: blueprint
    ports:
      - "8085:80"
    environment:
      - ENDPOINT_URL=http://0.0.0.0:8084/query
      # - SPARQL_CONSOLE_URL=http://trifid:8080/sparql
      # - GRAPH_EXPLORER_URL=http://trifid:8080/graph-explorer
    networks:
      - monorepo_default

  # === Query Tools ===

  # YASGUI - Standalone SPARQL query editor with autocomplete and visualization
  yasgui:
    image: redpencil/yasgui:latest
    container_name: yasgui
    ports:
      - "8086:80"
    environment:
      - DEFAULT_SPARQL_ENDPOINT=http://localhost:7878/query
    networks:
      - monorepo_default

  # Comunica - Federated SPARQL query engine for querying across multiple endpoints
  # Exposes a SPARQL endpoint that federates queries across configured sources
  comunica:
    image: comunica/query-sparql:latest
    container_name: comunica
    ports:
      - "8087:8080"
    command: http --port 8080 http://oxigraph:7878/query http://fuseki:3030/ds/sparql
    restart: unless-stopped
    networks:
      - monorepo_default

networks:
  monorepo_default:
    external: true

volumes:
  oxigraph_data:
  fuseki_data:
  refine_data:
  openrefine_data:
