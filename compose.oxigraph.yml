# Variant: Oxigraph as the primary store instead of QLever. No indexing step; SPARQL Update works.
#   docker compose -f compose.yml -f compose.oxigraph.yml up -d
#   ./scripts/load.sh          # loads data/sample into Fuseki *and* Oxigraph
# Oxigraph UI (YASGUI): http://localhost:7878   query: /query   update: /update   graph store: /store
services:
  oxigraph:
    image: oxigraph/oxigraph:0.5.11
    restart: unless-stopped
    volumes:
      - oxigraph_data:/data
    # --union-default-graph: default-graph queries see every named graph (same behaviour as Fuseki's
    # dataset here), so data loaded into a named graph by scripts/load.sh shows up everywhere.
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878", "--cors", "--union-default-graph"]
    ports:
      - "${OXIGRAPH_PORT:-7878}:7878"

  # Park the QLever services in an inactive profile so plain `up` does not start them.
  qlever:
    profiles: [qlever]
  qlever-index:
    profiles: [qlever]
  qlever-ui:
    profiles: [qlever]

  trifid:
    environment:
      SPARQL_ENDPOINT_URL: http://oxigraph:7878/query
      DATASET_BASE_URL: "http://localhost:${TRIFID_PORT:-8084}/"   # base of the IRIs in data/sample

  blueprint:
    environment:
      FULL_TEXT_SEARCH_DIALECT: fuseki   # Blueprint has no Oxigraph dialect; search falls back

  comunica:
    command:
      - "-p"
      - "8080"
      - "sparql@http://oxigraph:7878/query"
      - "sparql@http://fuseki:3030/ds/sparql"

volumes:
  oxigraph_data:
