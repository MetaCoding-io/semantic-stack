# Variant: Fuseki as the primary store, no QLever. Smallest footprint; SPARQL Update + SHACL + text index.
#   docker compose -f compose.yml -f compose.fuseki.yml up -d
#   ./scripts/load.sh
services:
  qlever:
    profiles: [qlever]
  qlever-index:
    profiles: [qlever]
  qlever-ui:
    profiles: [qlever]

  trifid:
    environment:
      SPARQL_ENDPOINT_URL: http://fuseki:3030/ds/sparql
      DATASET_BASE_URL: "http://localhost:${TRIFID_PORT:-8084}/"

  blueprint:
    environment:
      FULL_TEXT_SEARCH_DIALECT: fuseki

  comunica:
    command:
      - "-p"
      - "8080"
      - "sparql@http://fuseki:3030/ds/sparql"
