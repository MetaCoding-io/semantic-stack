# semantic-stack: a turnkey semantic-web / knowledge-graph stack.
#
#   docker compose up -d          # start the default stack (Fuseki is the primary store)
#   ./scripts/load.sh             # load data/sample into Fuseki
#   open http://localhost:8080    # landing page linking every service
#
# Optional profiles add engines and tools (docker compose --profile <name> up -d, or COMPOSE_PROFILES in .env):
#   qlever        QLever + QLever UI (run `--profile qlever-index run --rm qlever-index` once first; `make qlever-up` does both)
#   oxigraph      Oxigraph, a lightweight Rust store
#   graphdb       Ontotext GraphDB Free
#   tools         Python toolbox (+ jelly-cli), RMLMapper, YARRRML, SDM-RDFizer, rudof, EYE, ROBOT, Nemo, WIDOCO, RPT (CLI)
#   jupyter       JupyterLab with the toolbox
#   ontop         Postgres + Ontop virtual knowledge graph
#   virtuoso      OpenLink Virtuoso Open Source, a second full store
#   geosparql     Fuseki + GeoSPARQL (Zazuko build, same Jena as the main Fuseki)
#   prez          Prez Linked Data API (+ Prez UI) over Fuseki
#   grlc          grlc: the .rq files in grlc/queries as a Swagger REST API
#   graph-explorer  AWS Graph Explorer over Fuseki
#   docs          pyLODE as an HTTP service
#   rpt           RDF Processing Toolkit: SPARQL/GraphQL server with YASGUI proxying Fuseki
#   lp-etl        LinkedPipes ETL (four containers)
#   validation    ITB SHACL validator (web form + REST + SOAP)
#   observability Prometheus + sparql-prometheus-exporter + Grafana with the SPARQL datasource
#   mcp           MCP servers for coding agents: sparql-mcp (Fuseki), rudof-mcp, open-ontologies
#   graphrag      Flexible GraphRAG (LLM knowledge-graph construction + hybrid search) + Qdrant
#   ollama        Ollama, a local OpenAI-compatible LLM for the graphrag profile
#   solid         Community Solid Server (Solid Pod / LDP server)
#
# URL rule of thumb: anything a *browser* loads (Blueprint, the QLever UI backend setting)
# must use localhost:<host port>; anything a *container* calls (Trifid, Comunica) uses the
# service name and the container port. Mixing these up is the number one cause of
# "it starts but nothing works".

name: semantic-stack

x-restart: &restart
  restart: unless-stopped

x-qlever: &qlever
  image: adfreiburg/qlever:commit-9541c1975c   # QLever publishes no release tags; bump the commit tag deliberately
  working_dir: /data
  # Run as your host ids so the index files written to ./qlever are owned by you (the image's
  # entrypoint supports an arbitrary uid; see `docker run adfreiburg/qlever` for its help text).
  user: "${QLEVER_UID:-1000}:${QLEVER_GID:-1000}"
  volumes:
    - ./qlever:/data

services:
  # ---------------------------------------------------------------- landing page
  landing:
    image: nginx:1.31-alpine
    <<: *restart
    networks:
      default:
        aliases: [landing.internal]   # pyLODE's URL validator wants a dotted host: http://landing.internal/data/...
    volumes:
      - ./landing:/usr/share/nginx/html:ro
      - ./data:/usr/share/nginx/html/data:ro   # browse ./data at http://localhost:8080/data/; pyLODE fetches it as http://landing.internal/data/...
    ports:
      - "${LANDING_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------- triple stores
  # QLever (profile: qlever): very fast SPARQL engine for large, read-mostly graphs (Wikidata
  # scale). Needs a one-time index build (qlever-index). Endpoint: http://qlever:7001 (POST or
  # GET ?query=). The server is API-only; the UI is the separate qlever-ui service.
  qlever:
    <<: [*qlever, *restart]
    profiles: [qlever]
    command:
      - -c
      - |
        if ! ls ./*.index.* >/dev/null 2>&1; then
          echo 'QLever: no index found in ./qlever. Build one first:'
          echo '  docker compose --profile qlever-index run --rm qlever-index   (or: make qlever-up)'
          sleep 30
          exit 1
        fi
        exec qlever start --run-in-foreground
    ports:
      - "${QLEVER_PORT:-7001}:7001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7001/?query=SELECT%20%2A%20WHERE%20%7B%20%3Fs%20%3Fp%20%3Fo%20%7D%20LIMIT%201"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot job: download the demo dataset named in qlever/Qleverfile and build the index.
  # Re-run after editing qlever/Qleverfile to index your own data. Its own profile so that
  # `--profile qlever up` does not re-index on every start.
  qlever-index:
    <<: *qlever
    profiles: [qlever-index]
    command:
      - -c
      - qlever get-data && qlever index --overwrite-existing

  # QLever UI (Django app). The backend URL is what the *browser* calls, hence localhost.
  qlever-ui:
    image: adfreiburg/qlever-ui:latest   # upstream publishes no version tags
    <<: *restart
    profiles: [qlever]
    environment:
      QLEVER_UI_BACKEND_SLUG: olympics
      QLEVER_UI_BACKEND_URL: "http://localhost:${QLEVER_PORT:-7001}"
    volumes:
      - ./qlever-ui/configure-and-run.sh:/configure-and-run.sh:ro
    command: ["bash", "/configure-and-run.sh"]
    ports:
      - "${QLEVER_UI_PORT:-7000}:7000"

  # Apache Jena Fuseki: the primary store. SPARQL 1.1 Query + Update, Graph Store Protocol,
  # SHACL endpoint, Lucene text index, TDB persistence. Trifid, Blueprint and Comunica point here.
  #   query:  http://fuseki:3030/ds/sparql     update: http://fuseki:3030/ds/update
  #   data:   http://fuseki:3030/ds/data       shacl:  http://fuseki:3030/ds/shacl
  # Note: the dataset uses unionDefaultGraph, so load data into a *named* graph
  # (scripts/load.sh does) or it will not show up in default-graph queries.
  fuseki:
    image: secoresearch/fuseki:6.2.0
    <<: *restart
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      ENABLE_DATA_WRITE: "true"
      ENABLE_UPDATE: "true"
      ENABLE_SHACL: "true"
      QUERY_TIMEOUT: "60000"
    volumes:
      - fuseki_data:/fuseki-base/databases
      - ./data:/data:ro   # lets you run Jena CLI tools, e.g. docker compose exec fuseki /jena/bin/riot --validate /data/sample/semantic-stack.ttl
    ports:
      - "${FUSEKI_PORT:-3030}:3030"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3030/ds/sparql?query=ASK%7B%7D"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Oxigraph (profile: oxigraph): lightweight Rust store with a built-in YASGUI at :7878.
  #   query: http://oxigraph:7878/query   update: /update   graph store: /store
  # --union-default-graph makes default-graph queries see every named graph, like Fuseki's dataset.
  # No healthcheck: the image is distroless (no shell or curl), so wait for it from outside
  # (`scripts/smoke.sh oxigraph`, which `make oxigraph-up` does) before loading data.
  oxigraph:
    profiles: [oxigraph]
    image: oxigraph/oxigraph:0.5.13
    <<: *restart
    volumes:
      - oxigraph_data:/data
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878", "--cors", "--union-default-graph"]
    ports:
      - "${OXIGRAPH_PORT:-7878}:7878"

  # ---------------------------------------------------------------- repository management
  # RDF4J Server + Workbench. Add your stores under Repositories > New > "SPARQL endpoint proxy"
  # using container URLs such as http://qlever:7001 or http://fuseki:3030/ds/sparql.
  # Open it through the landing page (or the README link): the Workbench runs inside the container and
  # resolves its server from the browser's host header, so http://localhost:8082/rdf4j-workbench/ makes
  # it dial localhost:8082 *inside* the container and fail. The link passes
  # ?workbench-server=http://127.0.0.1:8080/rdf4j-server once (the choice is kept in a cookie); the
  # accepted-server-prefixes property below is what lets the Workbench accept that URL, since by default
  # it only trusts same-origin /rdf4j-server.
  rdf4j:
    image: eclipse/rdf4j-workbench:6.1.0-tomcat
    <<: *restart
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1g -Dorg.eclipse.rdf4j.workbench.accepted-server-prefixes=http://127.0.0.1:8080/rdf4j-server"
    volumes:
      - rdf4j_data:/var/rdf4j
    ports:
      - "${RDF4J_PORT:-8082}:8080"

  # ---------------------------------------------------------------- data transformation
  # OpenRefine, built from the official release tarball (there is no official image).
  openrefine:
    build: ./openrefine
    image: ghcr.io/metacoding-io/semantic-stack-openrefine:3.10.0
    <<: *restart
    volumes:
      - openrefine_data:/data
      - ./data:/import:ro
    ports:
      - "${OPENREFINE_PORT:-3333}:3333"

  # RML Mapper: CSV/JSON/XML -> RDF. One-shot CLI, see data/rml/README.md.
  #   docker compose --profile tools run --rm rmlmapper -m /data/rml/mapping.rml.ttl -o /data/rml/output.ttl -s turtle
  rmlmapper:
    profiles: [tools]
    image: rmlio/rmlmapper-java:v8.0.1
    volumes:
      - ./data:/data

  # YARRRML parser: human-friendly YAML mappings -> RML.
  #   docker compose --profile tools run --rm yarrrml -i /data/rml/mapping.yarrrml.yml -o /data/rml/mapping.rml.ttl
  yarrrml:
    profiles: [tools]
    image: rmlio/yarrrml-parser:1.11.0
    volumes:
      - ./data:/data

  # SDM-RDFizer: second RML engine, 100 % conformant on the new RML spec modules in the KGCW 2026
  # challenge. Runs the RML that the yarrrml step produces; config in data/rml/sdm-rdfizer.ini.
  #   docker compose --profile tools run --rm sdm-rdfizer
  sdm-rdfizer:
    profiles: [tools]
    image: sdmtib/sdmrdfizer:4.7.5.15.2
    platform: linux/amd64   # upstream publishes amd64 only
    entrypoint: ["python3", "-m", "rdfizer"]
    command: ["-c", "/data/rml/sdm-rdfizer.ini"]
    working_dir: /data
    volumes:
      - ./data:/data

  # SPARQL Anything: query CSV, JSON, XML, HTML, spreadsheets, ... as RDF with no mapping at all
  # (Facade-X). SPARQL endpoint /sparql.anything, YASGUI at /sparql. ./data is visible as /data.
  #   see data/queries/30-sparql-anything-csv.rq
  sparql-anything:
    image: facadex/sparql-anything:v1.3.0
    <<: *restart
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1g"
    volumes:
      - ./data:/data:ro
    ports:
      - "${SPARQL_ANYTHING_PORT:-8093}:3000"

  # ---------------------------------------------------------------- visualisation & browsing
  # WebVOWL + OWL2VOWL converter, built from upstream source (the old war download is gone).
  # First build takes a few minutes; `docker compose pull webvowl` fetches the prebuilt image instead.
  webvowl:
    build: ./webvowl
    image: ghcr.io/metacoding-io/semantic-stack-webvowl:1.1.7
    <<: *restart
    volumes:
      - ./data:/data:ro
    ports:
      - "${WEBVOWL_PORT:-8083}:8080"
    healthcheck:   # the image's own check polls every 30s; poll faster so `up --wait` returns sooner
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/serverTimeStamp"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  # Trifid (Zazuko): Linked Data frontend. Dereferences resource IRIs, ships a YASGUI SPARQL
  # console at /sparql, Graph Explorer at /graph-explorer and a CORS-friendly proxy at /query.
  # DATASET_BASE_URL = the base the data's IRIs are minted under; data/sample uses
  # http://localhost:8084/, so http://localhost:8084/service/fuseki dereferences out of the box.
  # Point it at another store with TRIFID_SPARQL_ENDPOINT_URL in .env.
  trifid:
    image: ghcr.io/zazuko/trifid:v6
    <<: *restart
    environment:
      SPARQL_ENDPOINT_URL: ${TRIFID_SPARQL_ENDPOINT_URL:-http://fuseki:3030/ds/sparql}
      DATASET_BASE_URL: ${TRIFID_DATASET_BASE_URL:-http://localhost:${TRIFID_PORT:-8084}/}
    ports:
      - "${TRIFID_PORT:-8084}:8080"

  # Blueprint (Zazuko): knowledge-graph browser. It is a browser app, so every URL below is
  # what the *browser* calls. Blueprint shows nothing until a Blueprint configuration graph
  # is loaded into the store; see https://github.com/zazuko/blueprint.
  blueprint:
    image: ghcr.io/zazuko/blueprint:v1
    <<: *restart
    environment:
      ENDPOINT_URL: "http://localhost:${TRIFID_PORT:-8084}/query"
      SPARQL_CONSOLE_URL: "http://localhost:${TRIFID_PORT:-8084}/sparql/#query"
      GRAPH_EXPLORER_URL: "http://localhost:${TRIFID_PORT:-8084}/graph-explorer/?resource"
      FULL_TEXT_SEARCH_DIALECT: ${BLUEPRINT_FTS_DIALECT:-fuseki}   # fuseki | qlever | stardog | graphdb | neptune
      SKIP_AUTHENTICATION: "true"
      LINK_CONFIGURATION: app
    ports:
      - "${BLUEPRINT_PORT:-8085}:80"

  # Skosmos (National Library of Finland): SKOS vocabulary browser and REST API. Configured in
  # skosmos/config.ttl against Fuseki (plain SPARQL, "Generic" dialect). Shows the sample
  # thesaurus data/sample/semantic-stack-skos.ttl once `scripts/load.sh` has run.
  skosmos:
    image: quay.io/natlibfi/skosmos:v3.5
    <<: *restart
    volumes:
      - ./skosmos/config.ttl:/var/www/html/config.ttl:ro
    ports:
      - "${SKOSMOS_PORT:-9090}:80"

  # Sparklis: visual, natural-language-guided SPARQL query builder. Runs in the browser, so the
  # endpoint it talks to must allow CORS; the landing page points it at the sparql-proxy.
  #   http://localhost:8092/?endpoint=http://localhost:8090/sparql
  sparklis:
    image: sferre/sparklis:latest@sha256:5cda9856c95b2611a62656478e93c513008f5233075d5fec6a89e5f6c0d279ee   # upstream publishes only `latest`; pinned by digest
    platform: linux/amd64
    <<: *restart
    ports:
      - "${SPARKLIS_PORT:-8092}:8080"

  # Sparnatural (Sparna): visual query builder driven by a SHACL configuration. Static site, so the
  # browser sends queries to the CORS-enabled sparql-proxy (endpoint attribute in sparnatural/index.html).
  # sparnatural/config.ttl describes data/sample; docs at https://docs.sparnatural.eu/
  sparnatural:
    image: nginx:1.31-alpine
    <<: *restart
    volumes:
      - ./sparnatural:/usr/share/nginx/html:ro
    ports:
      - "${SPARNATURAL_PORT:-8094}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/config.ttl"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------- federated querying
  # Comunica as an HTTP SPARQL endpoint federating over the stores in COMUNICA_SOURCES
  # (space-separated; add sparql@http://qlever:7001 or sparql@http://oxigraph:7878/query in .env
  # when those profiles are up; an unreachable source fails the whole query).
  #   http://localhost:8087/sparql?query=...
  comunica:
    image: comunica/query-sparql:v5.2.4
    <<: *restart
    environment:
      COMUNICA_SOURCES: ${COMUNICA_SOURCES:-sparql@http://fuseki:3030/ds/sparql}
    entrypoint: ["sh", "-c", "exec node ./bin/http.js -p 8080 $$COMUNICA_SOURCES"]
    ports:
      - "${COMUNICA_PORT:-8087}:8080"

  # ---------------------------------------------------------------- SPARQL proxy
  # sparql-proxy (DBCLS): caching, job queue, concurrency limit and admin dashboard in front of
  # Fuseki (or any other store: set SPARQL_PROXY_BACKEND in .env, e.g. http://qlever:7001).
  # Rejects SPARQL Update, so it is the endpoint to hand to browser tools and to anyone who
  # should not write. Endpoint /sparql (CORS enabled), dashboard /admin.
  #   admin login: admin / $SPARQL_PROXY_ADMIN_PASSWORD (default admin)
  # Query logging: set QUERY_LOG_PATH to a writable file to record every query and response.
  sparql-proxy:
    image: ghcr.io/dbcls/sparql-proxy:snapshot-a0bf55c   # upstream publishes no release tags; bump the snapshot tag deliberately
    <<: *restart
    environment:
      SPARQL_BACKEND: ${SPARQL_PROXY_BACKEND:-http://fuseki:3030/ds/sparql}
      ADMIN_USER: admin
      ADMIN_PASSWORD: ${SPARQL_PROXY_ADMIN_PASSWORD:-admin}
      CACHE_STORE: memory
      MEMORY_MAX_ENTRIES: "1000"
      MAX_CONCURRENCY: "4"
      MAX_LIMIT: "100000"
      TRUST_PROXY: "true"
    ports:
      - "${SPARQL_PROXY_PORT:-8090}:3000"

  # ---------------------------------------------------------------- validation
  # SHACL Play (Sparna): validate data against shapes with readable reports, document shapes as
  # HTML and UML, generate shapes from data, convert OWL to SHACL, run SHACL rules. Built from
  # source (see shacl-play/Dockerfile); `docker compose pull shacl-play` fetches the prebuilt image.
  shacl-play:
    build: ./shacl-play
    image: ghcr.io/metacoding-io/semantic-stack-shacl-play:0.12.5
    <<: *restart
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1g"
    ports:
      - "${SHACL_PLAY_PORT:-8091}:8080"

  # pySHACL as an HTTP service (OpenAPI). POST JSON {"data_graph": ..., "shapes_graph": ...} to
  # /validate; Swagger UI at /docs/swagger. Same pySHACL release as the tools image.
  #   curl -s -X POST http://localhost:8099/validate -H 'Content-Type: application/json' \
  #     -d "$(jq -n --rawfile d data/sample/semantic-stack.ttl --rawfile s data/sample/shapes.ttl '{data_graph:$d, shapes_graph:$s}')"
  pyshacl:
    build: ./pyshacl
    image: ghcr.io/metacoding-io/semantic-stack-pyshacl:0.40.1
    <<: *restart
    ports:
      - "${PYSHACL_PORT:-8099}:8099"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/docs/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------- tools (profile: tools / jupyter)
  # Python toolbox: rdflib, pySHACL, SPARQLWrapper, OWL-RL, LinkML, pyLODE, pandas.
  #   docker compose --profile tools run --rm tools pyshacl -s sample/shapes.ttl sample/semantic-stack.ttl
  #   docker compose --profile tools run --rm tools gen-owl linkml/semantic-stack.yaml
  tools:
    profiles: [tools]
    build: ./tools
    image: ghcr.io/metacoding-io/semantic-stack-tools:latest
    working_dir: /data
    environment:
      FUSEKI_URL: http://fuseki:3030/ds/sparql
      FUSEKI_UPDATE_URL: http://fuseki:3030/ds/update
      QLEVER_URL: http://qlever:7001
      OXIGRAPH_URL: http://oxigraph:7878/query
    volumes:
      - ./data:/data
    command: ["bash"]

  # rudof: ShEx + SHACL + DCTAP validation and conversion in one Rust binary.
  #   docker compose --profile tools run --rm rudof shacl-validate --shapes sample/shapes.ttl sample/semantic-stack.ttl
  #   docker compose --profile tools run --rm rudof shacl sample/shapes.ttl
  rudof:
    profiles: [tools]
    image: angelip2303/rudof:0.3.35
    platform: linux/amd64   # upstream publishes amd64 only
    working_dir: /data
    volumes:
      - ./data:/data
    command: ["--help"]

  # EYE: Notation3 reasoner (forward and backward chaining).
  #   docker compose --profile tools run --rm eye --quiet --nope n3/socrates.n3 --pass
  eye:
    profiles: [tools]
    image: eyereasoner/eye:11.24.8
    platform: linux/amd64   # upstream publishes amd64 only
    working_dir: /data
    volumes:
      - ./data:/data
    command: ["--help"]

  # ROBOT (OBO Foundry): OWL toolkit - reason (ELK/HermiT/whelk), report (QC), convert, merge, extract.
  #   docker compose --profile tools run --rm robot reason --reasoner ELK --input sample/semantic-stack-vocab.ttl --output out/vocab-reasoned.ttl
  #   docker compose --profile tools run --rm robot report --fail-on none --input sample/semantic-stack-vocab.ttl --output out/vocab-report.tsv
  robot:
    profiles: [tools]
    image: obolibrary/robot:v1.9.10
    entrypoint: ["robot"]
    environment:
      ROBOT_JAVA_ARGS: "-Xmx1g"
    working_dir: /data
    volumes:
      - ./data:/data
    command: ["--help"]

  # Nemo (TU Dresden): Datalog rule engine that reads Turtle/N-Triples/TriG and SPARQL endpoints and
  # writes RDF. Rules live in data/nemo/*.rls; the image has no shell.
  #   docker compose --profile tools run --rm nemo -D out -o nemo/dependencies.rls
  nemo:
    profiles: [tools]
    image: ghcr.io/knowsys/nemo:v0.10.1
    working_dir: /data
    volumes:
      - ./data:/data
    command: ["--help"]

  # WIDOCO: wizard-style HTML documentation (+ WebVOWL view) for an ontology. One-shot CLI.
  #   docker compose --profile tools run --rm widoco -ontFile data/sample/semantic-stack-vocab.ttl -outFolder data/out/widoco -rewriteAll -webVowl -uniteSections -lang en
  # Output: data/out/widoco/doc/ for a slash ontology IRI like the sample vocabulary
  # (browse it at http://localhost:8080/data/out/widoco/doc/).
  widoco:
    profiles: [tools]
    image: ghcr.io/dgarijo/widoco:v1.4.26
    platform: linux/amd64   # upstream publishes amd64 only
    # The image runs as its own unprivileged user, which can't create data/out/widoco once the other
    # tools (which run as root) have created data/out; run as root like them, output ownership matches.
    user: "0:0"
    environment:
      JAVA_OPTS: "-Xmx1g"
    volumes:
      - ./data:/usr/local/widoco/data
    command: ["--help"]

  # RPT as a one-shot CLI: run SPARQL files over data/sample, convert RML to SPARQL CONSTRUCT.
  #   docker compose --profile tools run --rm rpt-cli integrate sample/semantic-stack.ttl queries/01-services-by-category.rq
  #   docker compose --profile tools run --rm rpt-cli rmltk rml to sparql rml/mapping.rml.ttl
  rpt-cli:
    profiles: [tools]
    image: aksw/rpt:2.0.0-rc7
    platform: linux/amd64   # upstream publishes amd64 only
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1g"
    working_dir: /data
    volumes:
      - ./data:/data
    command: ["--help"]

  jupyter:
    profiles: [jupyter]
    build: ./tools
    image: ghcr.io/metacoding-io/semantic-stack-tools:latest
    <<: *restart
    working_dir: /work
    environment:
      FUSEKI_URL: http://fuseki:3030/ds/sparql
      QLEVER_URL: http://qlever:7001
      OXIGRAPH_URL: http://oxigraph:7878/query
    volumes:
      - ./notebooks:/work
      - ./data:/work/data
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.token=
      - --ServerApp.password=
    ports:
      - "${JUPYTER_PORT:-8888}:8888"

  # ---------------------------------------------------------------- Ontop virtual knowledge graph (profile: ontop)
  # Query a relational database as RDF without copying it. Demo: ontop/postgres/init.sql holds
  # a table describing this stack; ontop/input/mapping.obda maps it to the same vocabulary as
  # data/sample. SPARQL at http://localhost:8089/sparql, portal UI at http://localhost:8089/.
  postgres:
    profiles: [ontop]
    image: postgres:18-alpine
    <<: *restart
    environment:
      POSTGRES_USER: stack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stack}
      POSTGRES_DB: stack
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql/<major>/docker and must be mounted at
      # /var/lib/postgresql (not .../data). Had the demo running on 17? Wipe it first:
      #   docker compose --profile ontop down -v
      - postgres_data:/var/lib/postgresql
      - ./ontop/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stack -d stack"]
      interval: 5s
      timeout: 3s
      retries: 10

  ontop:
    profiles: [ontop]
    build: ./ontop
    image: ghcr.io/metacoding-io/semantic-stack-ontop:5.5.0
    <<: *restart
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ONTOP_MAPPING_FILE: /opt/ontop/input/mapping.obda
      ONTOP_ONTOLOGY_FILE: /opt/ontop/ontology/semantic-stack-vocab.ttl
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/ontop.properties
      ONTOP_DB_URL: jdbc:postgresql://postgres:5432/stack
      ONTOP_DB_USER: stack
      ONTOP_DB_PASSWORD: ${POSTGRES_PASSWORD:-stack}
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      ONTOP_WAIT_FOR: postgres:5432
    volumes:
      - ./ontop/input:/opt/ontop/input:ro
      - ./data/sample/semantic-stack-vocab.ttl:/opt/ontop/ontology/semantic-stack-vocab.ttl:ro
    ports:
      - "${ONTOP_PORT:-8089}:8080"

  # ---------------------------------------------------------------- GraphDB (profile: graphdb)
  # Ontotext GraphDB, the store most enterprise teams already run. Starts in Free mode; if it asks
  # for a licence, request the free one from Ontotext and upload it in Setup > License.
  graphdb:
    profiles: [graphdb]
    image: ontotext/graphdb:11.5.2
    <<: *restart
    environment:
      GDB_JAVA_OPTS: "-Xms1g -Xmx2g"
    volumes:
      - graphdb_home:/opt/graphdb/home
    ports:
      - "${GRAPHDB_PORT:-7200}:7200"

  # ---------------------------------------------------------------- Virtuoso (profile: virtuoso)
  # OpenLink Virtuoso Open Source: the store behind DBpedia and much of the LOD cloud. HTTP, SPARQL
  # and the Conductor admin UI on 8890, isql on 1111. scripts/load.sh loads data/sample into it.
  #   query:  http://virtuoso:8890/sparql?query=...     admin: http://localhost:8890/conductor (dba / $VIRTUOSO_DBA_PASSWORD)
  #   load:   curl --digest -u dba:dba -T file.ttl "http://localhost:8890/sparql-graph-crud-auth?graph=<iri>"
  # Any virtuoso.ini key can be set as VIRT_<SECTION>_<KEY>. Licence GPL-2.0.
  virtuoso:
    profiles: [virtuoso]
    image: openlink/virtuoso-opensource-7:7.2.17
    <<: *restart
    environment:
      DBA_PASSWORD: ${VIRTUOSO_DBA_PASSWORD:-dba}
      DAV_PASSWORD: ${VIRTUOSO_DBA_PASSWORD:-dba}
      VIRT_PARAMETERS_NUMBEROFBUFFERS: "170000"    # ~1.3 GB of buffers; see the sizing table in virtuoso.ini
      VIRT_PARAMETERS_MAXDIRTYBUFFERS: "130000"
      VIRT_PARAMETERS_DIRSALLOWED: ".,../vad,/usr/share/proj,/data"   # lets isql ld_dir('/data', ...) bulk-load ./data
    volumes:
      - virtuoso_data:/database
      - ./data:/data:ro
    ports:
      - "${VIRTUOSO_PORT:-8890}:8890"
      - "${VIRTUOSO_ISQL_PORT:-1111}:1111"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8890/sparql?query=ASK%7B%7D"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ---------------------------------------------------------------- Fuseki + GeoSPARQL (profile: geosparql)
  # Zazuko's Fuseki-main build with Jena GeoSPARQL and Apache SIS (same Jena 6.2 as the main Fuseki).
  # fuseki-geosparql/config.ttl adds update and Graph Store endpoints so scripts/load.sh can feed it;
  # data/sample/semantic-stack-geo.ttl has WKT points, data/queries/40-geosparql-nearby.rq uses them.
  #   query: http://localhost:3031/ds/sparql   update: /ds/update   data: /ds/data (admin / $FUSEKI_ADMIN_PASSWORD)
  fuseki-geosparql:
    profiles: [geosparql]
    image: ghcr.io/zazuko/fuseki-geosparql:v5.2.0
    <<: *restart
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      JAVA_OPTS: "-Xms512m -Xmx1g"
      DISABLE_OTEL: "true"
    volumes:
      - ./fuseki-geosparql/config.ttl:/fuseki/configuration/config.ttl:ro
      - fuseki_geosparql_data:/fuseki/databases
      - ./data:/data:ro
    ports:
      - "${FUSEKI_GEOSPARQL_PORT:-3031}:3030"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3030/ds/sparql?query=ASK%7B%7D"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ---------------------------------------------------------------- Prez (profile: prez)
  # Prez (RDFLib / KurrawongAI): Linked Data API over Fuseki - content negotiation by profile, OGC API
  # Features, search, /object?uri=<any IRI>. Waits for the endpoint at start. OpenAPI UI at /docs.
  #   http://localhost:8000/docs   http://localhost:8000/object?uri=http://localhost:8084/service/fuseki
  prez:
    profiles: [prez]
    image: ghcr.io/rdflib/prez:4.25.1
    <<: *restart
    environment:
      SPARQL_ENDPOINT: ${PREZ_SPARQL_ENDPOINT:-http://fuseki:3030/ds/sparql}
      SYSTEM_URI: "http://localhost:${PREZ_PORT:-8000}"
      LOG_LEVEL: INFO
    ports:
      - "${PREZ_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Prez UI: browser app, so the API URL is the *host* URL. 3.8.3 is the last generic UI image
  # (the v4 UI is generated per site); it may lag the 4.x API.
  prez-ui:
    profiles: [prez]
    image: ghcr.io/rdflib/prez-ui:3.8.3
    <<: *restart
    environment:
      VITE_API_BASE_URL: "http://localhost:${PREZ_PORT:-8000}"
    ports:
      - "${PREZ_UI_PORT:-8001}:80"

  # ---------------------------------------------------------------- grlc (profile: grlc)
  # grlc (CLARIAH): every .rq file in grlc/queries becomes a Swagger-documented REST route over Fuseki.
  # GRLC_SERVER_NAME ends up in the OpenAPI "host" field, so it must be the *browser* host:port.
  #   http://localhost:8088/api-local/          Swagger UI        http://localhost:8088/api-local/swagger   spec
  #   http://localhost:8088/api-local/services  runs grlc/queries/services.rq (?_name variables become parameters)
  grlc:
    profiles: [grlc]
    image: clariah/grlc:v1.3.11
    platform: linux/amd64   # upstream publishes amd64 only
    <<: *restart
    environment:
      GRLC_SERVER_NAME: "localhost:${GRLC_PORT:-8088}"
      GRLC_SPARQL_ENDPOINT: ${GRLC_SPARQL_ENDPOINT:-http://fuseki:3030/ds/sparql}
      GRLC_GITHUB_ACCESS_TOKEN: ${GRLC_GITHUB_ACCESS_TOKEN:-}
      # The entrypoint chown -R's /home/grlc (queries included) to the grlc user and aborts
      # when that fails, so the mount must be writable; mapping grlc to your UID keeps the
      # files on the host owned by you.
      USERMAP_UID: ${QLEVER_UID:-1000}
      USERMAP_GID: ${QLEVER_GID:-1000}
    volumes:
      - ./grlc/queries:/home/grlc/queries
    ports:
      - "${GRLC_PORT:-8088}:80"

  # ---------------------------------------------------------------- Graph Explorer (profile: graph-explorer)
  # AWS Graph Explorer: click-to-explore instance graph over SPARQL. The *container* queries the store
  # through its own proxy, so GRAPH_CONNECTION_URL is a service URL WITHOUT the trailing /sparql
  # (the server appends it). UI: http://localhost:8095/explorer
  graph-explorer:
    profiles: [graph-explorer]
    image: public.ecr.aws/neptune/graph-explorer:3.3.0
    platform: linux/amd64   # upstream publishes amd64 only
    <<: *restart
    environment:
      HOST: localhost
      PROXY_SERVER_HTTPS_CONNECTION: "false"
      GRAPH_EXP_HTTPS_CONNECTION: "false"
      GRAPH_TYPE: sparql
      GRAPH_CONNECTION_URL: ${GRAPH_EXPLORER_CONNECTION_URL:-http://fuseki:3030/ds}
      GRAPH_EXP_FETCH_REQUEST_TIMEOUT: "60000"
      PROXY_SERVER_ALLOWED_DB_ORIGINS: "http://fuseki:3030,http://sparql-proxy:3000,http://qlever:7001,http://virtuoso:8890"
    ports:
      - "${GRAPH_EXPLORER_PORT:-8095}:80"

  # ---------------------------------------------------------------- pyLODE server (profile: docs)
  # pyLODE as a service: HTML documentation for an ontology fetched by URL (GET only). The landing
  # page serves ./data, so the sample vocabulary is reachable from inside the network:
  #   http://localhost:8096/pylode?url=http://landing.internal/data/sample/semantic-stack-vocab.ttl
  pylode:
    profiles: [docs]
    build: ./pylode
    image: ghcr.io/metacoding-io/semantic-stack-pylode:3.6.0
    <<: *restart
    ports:
      - "${PYLODE_PORT:-8096}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------- RPT (profile: rpt)
  # RDF Processing Toolkit (AKSW): SPARQL server with YASGUI, GraphQL and a Linked Data viewer,
  # here proxying Fuseki. Landing page /, endpoint /sparql, GraphQL /graphql.
  rpt:
    profiles: [rpt]
    image: aksw/rpt:2.0.0-rc7
    platform: linux/amd64   # upstream publishes amd64 only
    <<: *restart
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1g"
    working_dir: /data
    volumes:
      - ./data:/data:ro
    command: ["integrate", "-e", "remote", "--loc", "${RPT_SPARQL_ENDPOINT:-http://fuseki:3030/ds/sparql}", "--server", "--port", "8642"]
    ports:
      - "${RPT_PORT:-8642}:8642"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8642/sparql?query=ASK%7B%7D"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ---------------------------------------------------------------- LinkedPipes ETL (profile: lp-etl)
  # Visual Linked Data ETL: pipelines of components (download, SPARQL transform, SHACL, upload to a
  # SPARQL endpoint, ...). Four containers; images are dated snapshots of main (no semver releases).
  # The baked configuration addresses the other containers as storage / executor / executor-monitor,
  # hence the network aliases. The frontend is a browser app, so LP_ETL_DOMAIN is the host URL.
  lp-etl-storage:
    profiles: [lp-etl]
    image: ghcr.io/linkedpipes/etl-storage:2026-10-01-398fe86
    <<: *restart
    networks:
      default:
        aliases: [storage]
    environment:
      LP_ETL_DOMAIN: "http://localhost:${LP_ETL_PORT:-9080}"
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    volumes:
      - lp_etl_storage:/data/lp-etl/storage
      - lp_etl_configuration:/data/lp-etl/configuration
      - lp_etl_logs:/data/lp-etl/logs

  lp-etl-executor:
    profiles: [lp-etl]
    image: ghcr.io/linkedpipes/etl-executor:2026-10-01-398fe86
    <<: *restart
    networks:
      default:
        aliases: [executor]
    environment:
      LP_ETL_DOMAIN: "http://localhost:${LP_ETL_PORT:-9080}"
      JAVA_TOOL_OPTIONS: "-Xmx1g"
    volumes:
      - lp_etl_execution:/data/lp-etl/executor
      - lp_etl_logs:/data/lp-etl/logs
      - lp_etl_configuration:/data/lp-etl/configuration
      - ./data:/data/input:ro   # pipelines can read the sample files here

  lp-etl-executor-monitor:
    profiles: [lp-etl]
    image: ghcr.io/linkedpipes/etl-executor-monitor:2026-10-01-398fe86
    <<: *restart
    networks:
      default:
        aliases: [executor-monitor]
    environment:
      LP_ETL_DOMAIN: "http://localhost:${LP_ETL_PORT:-9080}"
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    volumes:
      - lp_etl_execution:/data/lp-etl/executor
      - lp_etl_logs:/data/lp-etl/logs
      - lp_etl_configuration:/data/lp-etl/configuration

  lp-etl:
    profiles: [lp-etl]
    image: ghcr.io/linkedpipes/etl-frontend:2026-10-01-398fe86
    <<: *restart
    depends_on: [lp-etl-storage, lp-etl-executor, lp-etl-executor-monitor]
    environment:
      LP_ETL_DOMAIN: "http://localhost:${LP_ETL_PORT:-9080}"
    volumes:
      - lp_etl_configuration:/data/lp-etl/configuration
      - lp_etl_logs:/data/lp-etl/logs
    ports:
      - "${LP_ETL_PORT:-9080}:8080"

  # ---------------------------------------------------------------- ITB SHACL validator (profile: validation)
  # European Commission Interoperability Test Bed validator: web form, REST and SOAP, one "domain"
  # per shapes set. Domain "stack" (itb/stack/config.properties) validates against data/sample/shapes.ttl.
  #   UI:   http://localhost:8097/shacl/stack/upload     Swagger: http://localhost:8097/shacl/swagger-ui/index.html
  #   REST: curl -s -X POST http://localhost:8097/shacl/stack/api/validate -H 'Content-Type: application/json' \
  #           -d "$(jq -n --rawfile d data/sample/semantic-stack.ttl '{contentToValidate:$d, embeddingMethod:"STRING", contentSyntax:"text/turtle", validationType:"stack", reportSyntax:"text/turtle"}')"
  itb-shacl:
    profiles: [validation]
    image: isaitb/shacl-validator:1.13.1.1
    <<: *restart
    environment:
      validator.resourceRoot: /validator/resources/
      JAVA_TOOL_OPTIONS: "-Xmx1g"
    volumes:
      - ./itb:/validator/resources:ro
      - ./data/sample:/validator/resources/stack/shapes:ro   # shapes.ttl (the whole dir: a file can't be mounted inside a read-only mount)
    ports:
      - "${ITB_SHACL_PORT:-8097}:8080"

  # ---------------------------------------------------------------- observability (profile: observability)
  # Prometheus scrapes sparql-prometheus-exporter, which turns the SPARQL queries in
  # prometheus/sparql-exporter.yml into gauges per endpoint; Grafana ships the Flanders Make SPARQL
  # datasource (catalog plugin) provisioned against Fuseki, plus Prometheus. Login admin / $GRAFANA_ADMIN_PASSWORD.
  # QLever's own /metrics can be scraped too: see prometheus/prometheus.yml.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.1
    <<: *restart
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"

  sparql-exporter:
    profiles: [observability]
    image: ghcr.io/qup42/sparql-prometheus-exporter:0.1.0
    <<: *restart
    volumes:
      - ./prometheus/sparql-exporter.yml:/etc/sparql-exporter/config.yml:ro
    ports:
      - "${SPARQL_EXPORTER_PORT:-9199}:9199"

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.4
    <<: *restart
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: flandersmake-sparql-datasource@1.1.0   # needs grafana.com on first start
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  # ---------------------------------------------------------------- MCP servers (profile: mcp)
  # Model Context Protocol servers so a coding agent (Claude Code, ...) can work with the stack.
  # Generic SPARQL 1.1 MCP over Fuseki (SSE): SELECT/ASK/CONSTRUCT/DESCRIBE, SPARQL Update, Graph
  # Store Protocol, SHACL validation. Point SPARQL_MCP_QUERY_URL at sparql-proxy for a read-only agent.
  #   claude mcp add --transport sse sparql http://localhost:8103/sse
  sparql-mcp:
    profiles: [mcp]
    build: ./sparql-mcp
    image: ghcr.io/metacoding-io/semantic-stack-sparql-mcp:d9c0d57
    <<: *restart
    environment:
      SPARQL_QUERY_URL: ${SPARQL_MCP_QUERY_URL:-http://fuseki:3030/ds/sparql}
      SPARQL_UPDATE_URL: ${SPARQL_MCP_UPDATE_URL:-http://fuseki:3030/ds/update}
      SPARQL_GRAPH_STORE_URL: ${SPARQL_MCP_GSP_URL:-http://fuseki:3030/ds/data}
      SPARQL_USERNAME: admin
      SPARQL_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    ports:
      - "${SPARQL_MCP_PORT:-8103}:8000"

  # rudof as an MCP server (streamable HTTP): load RDF from files or http://fuseki:3030/ds/sparql,
  # run SPARQL, validate with ShEx/SHACL, inspect nodes. Same image as the rudof CLI.
  #   claude mcp add --transport http rudof http://localhost:8102/mcp
  rudof-mcp:
    profiles: [mcp]
    image: angelip2303/rudof:0.3.35
    platform: linux/amd64   # upstream publishes amd64 only
    <<: *restart
    working_dir: /data
    environment:
      RUDOF_MCP_STATE_PATH: /data/out/rudof-mcp-state.json
      RUST_LOG: info
    volumes:
      - ./data:/data
    command: ["mcp", "--transport", "streamable-http", "--bind", "0.0.0.0", "--port", "8000", "--route", "/mcp", "--allowed-network", "0.0.0.0/0"]
    ports:
      - "${RUDOF_MCP_PORT:-8102}:8000"

  # open-ontologies: MCP server for ontology work - load, validate, reason (RDFS/OWL-RL, SHACL), change
  # certificates, alignment - on an embedded Oxigraph. Streamable HTTP at /mcp, health at /health.
  # The image's default command is stdio; serve-http is what a container needs. Empty token = no auth.
  #   claude mcp add --transport http open-ontologies http://localhost:8101/mcp
  open-ontologies:
    profiles: [mcp]
    image: ghcr.io/fabio-rovai/open-ontologies:2.1.0
    <<: *restart
    environment:
      OPEN_ONTOLOGIES_STORAGE_MODE: persistent
      OPEN_ONTOLOGIES_ONTOLOGY_DIRS: /data/sample
      OPEN_ONTOLOGIES_TOKEN: ${OPEN_ONTOLOGIES_TOKEN:-}
    command: ["--data-dir", "/var/lib/open-ontologies", "serve-http", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - open_ontologies_data:/var/lib/open-ontologies
      - ./data:/data:ro
    ports:
      - "${OPEN_ONTOLOGIES_PORT:-8101}:8080"

  # ---------------------------------------------------------------- GraphRAG (profile: graphrag)
  # Flexible GraphRAG: ingest documents, extract a knowledge graph with an LLM, store it in Fuseki
  # (its own dataset "flexible-graphrag", auto-created through the admin API) and Qdrant, hybrid
  # search, chat UI and an MCP server. Needs an LLM key (ANTHROPIC_API_KEY by default) or the ollama
  # profile; embeddings run locally (all-MiniLM-L6-v2). The backend image is about 4 GB.
  #   UI/API behind one port: http://localhost:8105/  (API docs /docs)   MCP: http://localhost:3001/mcp
  qdrant:
    profiles: [graphrag]
    image: qdrant/qdrant:v1.20.0
    <<: *restart
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"

  flexible-graphrag:
    profiles: [graphrag]
    image: integratedsemantics/flexible-graphrag-backend:0.9.0
    <<: *restart
    depends_on:
      fuseki:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      LLM_PROVIDER: ${GRAPHRAG_LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
      OLLAMA_BASE_URL: http://ollama:11434     # used when GRAPHRAG_LLM_PROVIDER=ollama (profile ollama)
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      EMBEDDING_KIND: ${GRAPHRAG_EMBEDDING_KIND:-huggingface}
      HUGGINGFACE_EMBEDDING_MODEL: all-MiniLM-L6-v2
      HUGGINGFACE_EMBEDDING_DIMENSION: "384"
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      PG_GRAPH_DB: none
      RDF_GRAPH_DB: fuseki
      FUSEKI_BASE_URL: http://fuseki:3030
      FUSEKI_DATASET: flexible-graphrag        # not ds: the adapter expects Fuseki's /query layout
      FUSEKI_USERNAME: admin
      FUSEKI_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      VECTOR_DB: qdrant
      QDRANT_VECTOR_DB_CONFIG: '{"host": "qdrant", "port": 6333, "collection_name": "hybrid_search_vector", "https": false}'
      SEARCH_DB: bm25
      ENABLE_OBSERVABILITY: "false"
    volumes:
      - ./data:/app/sample_docs:ro
      - graphrag_uploads:/app/uploads
    ports:
      - "${FLEXIBLE_GRAPHRAG_PORT:-8104}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  flexible-graphrag-ui:
    profiles: [graphrag]
    image: integratedsemantics/flexible-graphrag-ui-react:0.9.0
    <<: *restart
    depends_on: [flexible-graphrag]
    environment:
      VITE_API_BASE_URL: /api

  # One port for UI and API, as upstream's proxy does (the UI is built for the /ui/react/ base path).
  graphrag-proxy:
    profiles: [graphrag]
    image: nginx:1.31-alpine
    <<: *restart
    depends_on: [flexible-graphrag, flexible-graphrag-ui]
    volumes:
      - ./graphrag/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${FLEXIBLE_GRAPHRAG_UI_PORT:-8105}:80"

  #   claude mcp add --transport http flexible-graphrag http://localhost:3001/mcp
  flexible-graphrag-mcp:
    profiles: [graphrag]
    build: ./flexible-graphrag-mcp
    image: ghcr.io/metacoding-io/semantic-stack-flexible-graphrag-mcp:0.8.4
    <<: *restart
    depends_on: [flexible-graphrag]
    environment:
      FLEXIBLE_GRAPHRAG_URL: http://flexible-graphrag:8000
    ports:
      - "${FLEXIBLE_GRAPHRAG_MCP_PORT:-3001}:3001"

  # ---------------------------------------------------------------- Ollama (profile: ollama)
  # Local models with an OpenAI-compatible API at http://ollama:11434/v1 (host: localhost:11434).
  #   docker compose --profile ollama exec ollama ollama pull qwen3:8b     # any model from ollama.com/library
  # GPU: add `gpus: all` (NVIDIA Container Toolkit) or use the 0.40.4-rocm tag with /dev/kfd and /dev/dri.
  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.40.11
    <<: *restart
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "/bin/ollama", "ls"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------- Solid (profile: solid)
  # Community Solid Server: a Solid Pod / LDP server to develop Solid apps against, file-backed in a
  # volume. CSS mints every IRI from CSS_BASE_URL, so it must be the URL the *browser* uses.
  #   http://localhost:8100/   (create an account and a pod; SOLID_CONFIG=config/file-root.json makes / writable without accounts)
  solid:
    profiles: [solid]
    image: solidproject/community-server:7.2.0
    <<: *restart
    environment:
      CSS_CONFIG: ${SOLID_CONFIG:-config/file.json}
      CSS_BASE_URL: "http://localhost:${SOLID_PORT:-8100}/"
      CSS_ROOT_FILE_PATH: /data
      CSS_LOGGING_LEVEL: info
    volumes:
      - solid_data:/data
    ports:
      - "${SOLID_PORT:-8100}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  fuseki_data:
  oxigraph_data:
  rdf4j_data:
  openrefine_data:
  postgres_data:
  graphdb_home:
  virtuoso_data:
  fuseki_geosparql_data:
  lp_etl_storage:
  lp_etl_configuration:
  lp_etl_logs:
  lp_etl_execution:
  prometheus_data:
  grafana_data:
  open_ontologies_data:
