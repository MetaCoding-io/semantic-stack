# SDM-RDFizer configuration: executes the RML produced by the yarrrml step in data/rml/README.md.
#   docker compose --profile tools run --rm yarrrml -i /data/rml/mapping.yarrrml.yml -o /data/rml/mapping.rml.ttl
#   docker compose --profile tools run --rm sdm-rdfizer
# Output lands in data/rml/sdm-output/ (ignored by git).
# Reference: https://github.com/SDM-TIB/SDM-RDFizer/wiki/The-Parameters-of-the-Configuration-file
[default]
main_directory: /data/rml

[datasets]
number_of_datasets: 1
output_folder: ${default:main_directory}/sdm-output
remove_duplicate: yes
all_in_one_file: no
name: services
enrichment: yes
ordered: yes
# n-triples is SDM-RDFizer's primary format; its Turtle writer emits invalid syntax (missing subjects).
output_format: n-triples

[dataset1]
name: services
mapping: ${default:main_directory}/mapping.rml.ttl
