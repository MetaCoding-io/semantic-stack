# Fronts the Flexible GraphRAG backend and React UI on one port, the way upstream's docker/proxy.yaml
# does: the UI is built for the /ui/react/ base path and calls /api relative to it.
events { worker_connections 256; }
http {
  server {
    listen 80;
    location = /health { return 200 "healthy\n"; add_header Content-Type text/plain; }
    location = / { return 302 /ui/react/; }
    location /api/ {
      proxy_pass http://flexible-graphrag:8000/api/;
      proxy_set_header Host $host;
      proxy_read_timeout 300; proxy_send_timeout 300; proxy_connect_timeout 300;
    }
    location /ui/react/api/ {
      rewrite ^/ui/react/api/(.*) /api/$1 break;
      proxy_pass http://flexible-graphrag:8000;
      proxy_set_header Host $host;
      proxy_read_timeout 300; proxy_send_timeout 300;
    }
    location /ui/react/ {
      proxy_pass http://flexible-graphrag-ui:3000/ui/react/;
      proxy_set_header Host $host;
    }
    location /docs { proxy_pass http://flexible-graphrag:8000/docs; }
    location /openapi.json { proxy_pass http://flexible-graphrag:8000/openapi.json; }
  }
}
