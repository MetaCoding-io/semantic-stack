# ITB SHACL validator domain "stack": validates data against data/sample/shapes.ttl.
# Keys: https://www.itb.ec.europa.eu/docs/guides/latest/validatingRDF/index.html
#   UI   http://localhost:8097/shacl/stack/upload
#   REST POST http://localhost:8097/shacl/stack/api/validate
validator.type = stack
validator.typeLabel.stack = semantic-stack sample data (data/sample/shapes.ttl)
validator.shaclFile.stack = shapes/shapes.ttl
validator.uploadTitle = semantic-stack SHACL validator
validator.channels = form, rest_api, soap_api
validator.defaultReportSyntax = text/turtle
